name: lip-office

services:
  lip-office:
    image: ghcr.io/laughinginpurgatory/lip-office:latest
    container_name: lip-office
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LIP_OFFICE_CONTAINER: "1"
      LIP_OFFICE_ALLOW_LAN_HOSTS: "1"
      LIP_OFFICE_ALLOWED_HOSTS: "kaarnavene.lan:3000"
    volumes:
      - /DATA/AppData/lip-office/documents:/app/documents
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
